<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zmeya Online 3D - Зеленая змейка онлайн в браузере бесплатно без регистрации</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 100;
            backdrop-filter: blur(5px);
            transition: opacity 0.5s;
        }
        #menu h1 {
            font-size: 4rem;
            margin-bottom: 2rem;
            text-shadow: 0 0 20px #00ff00;
            color: #aaffaa;
            letter-spacing: 5px;
        }
        .map-buttons {
            display: flex;
            gap: 2rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .map-btn {
            padding: 1.5rem 3rem;
            font-size: 1.5rem;
            border: 3px solid #00ff00;
            background: rgba(0, 100, 0, 0.5);
            color: #ccffcc;
            cursor: pointer;
            border-radius: 15px;
            transition: all 0.3s;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }
        .map-btn:hover {
            background: #00aa00;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 0 30px #00ff00;
        }
        .map-btn.selected {
            background: #00ff00;
            color: black;
            border-color: white;
            box-shadow: 0 0 40px #00ff00;
        }
        #start-btn {
            padding: 1.2rem 4rem;
            font-size: 2rem;
            background: #00cc00;
            border: none;
            color: black;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            margin-top: 1rem;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.7);
            letter-spacing: 3px;
        }
        #start-btn:hover {
            background: #00ff00;
            transform: scale(1.1);
            box-shadow: 0 0 50px #00ff00;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 2rem;
            text-shadow: 2px 2px 4px black;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 30px;
            border-radius: 20px;
            border-left: 8px solid #00ff00;
            z-index: 50;
            display: none;
        }
        #hud span {
            color: #ffaa00;
            font-weight: bold;
        }
        #controls-info {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #ccc;
            font-size: 1.2rem;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 25px;
            border-radius: 30px;
            z-index: 50;
            display: none;
            backdrop-filter: blur(3px);
            border: 1px solid #00ff0055;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 3rem 5rem;
            border-radius: 30px;
            text-align: center;
            z-index: 200;
            border: 4px solid #00ff00;
            box-shadow: 0 0 60px #00ff00;
            display: none;
            backdrop-filter: blur(10px);
        }
        #game-over h2 {
            font-size: 3rem;
            margin: 0 0 1rem;
            color: #00ff00;
            text-shadow: 0 0 20px #00ff00;
        }
        #game-over p {
            font-size: 1.8rem;
            margin: 0.5rem 0 2rem;
        }
        #restart-btn {
            padding: 1rem 3rem;
            font-size: 1.5rem;
            background: #00cc00;
            border: none;
            color: black;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        #restart-btn:hover {
            background: #00ff00;
            transform: scale(1.05);
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Меню -->
    <div id="menu">
        <h1>Zmeya Online 3D</h1>
        <div class="map-buttons">
            <button class="map-btn selected" data-map="empty">Пустая карта</button>
            <button class="map-btn" data-map="maze1">Лабиринт 1</button>
            <button class="map-btn" data-map="maze2">Лабиринт 2</button>
        </div>
        <button id="start-btn">ИГРАТЬ</button>
    </div>

    <!-- HUD -->
    <div id="hud">Счёт: <span id="score">0</span></div>
    <div id="controls-info">Управление: Стрелки или WASD</div>
    
    <!-- Game Over -->
    <div id="game-over">
        <h2>ИГРА ОКОНЧЕНА</h2>
        <p>Ваш счёт: <span id="final-score">0</span></p>
        <button id="restart-btn">ИГРАТЬ СНОВА</button>
    </div>

    <!-- Подключаем Three.js и OrbitControls -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Конфигурация ---
        const CONFIG = {
            cellSize: 1,
            gridSize: 15, // размер сетки для пустой карты
            snakeSpeed: 0.15, // задержка между шагами (сек)
            colors: {
                snakeHead: 0x00ff00,
                snakeBody: 0x00aa00,
                apple: 0xff3333,
                wall: 0x8B4513,
                ground: 0x2a2a2a,
                groundLight: 0x3a3a3a
            }
        };

        // --- Состояние игры ---
        let scene, camera, renderer, controls;
        let snake = []; // массив сегментов (Vector3)
        let direction = new THREE.Vector3(1, 0, 0); // начальное направление
        let nextDirection = new THREE.Vector3(1, 0, 0);
        let apple = null;
        let walls = []; // массив Vector3 с позициями стен
        let score = 0;
        let gameActive = false;
        let gameLoopInterval = null;
        let currentMap = 'empty';
        let gridSize = CONFIG.gridSize;
        let halfSize = Math.floor(gridSize / 2);
        
        // Временные объекты для 3D
        let snakeMeshes = []; // меши сегментов змейки
        let appleMesh = null;
        let wallMeshes = []; // меши стен

        // --- Инициализация Three.js ---
        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111122);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(12, 18, 15);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Освещение
            const ambientLight = new THREE.AmbientLight(0x404060);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            const d = 20;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            dirLight.shadow.camera.near = 1;
            dirLight.shadow.camera.far = 50;
            scene.add(dirLight);

            const fillLight = new THREE.PointLight(0x4466ff, 0.5);
            fillLight.position.set(-10, 10, -10);
            scene.add(fillLight);

            // OrbitControls для обзора
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = false;
            controls.target.set(0, 0, 0);
            controls.maxPolarAngle = Math.PI / 2.2;
            controls.minDistance = 5;
            controls.maxDistance = 40;

            // Обработка ресайза
            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Очистка сцены от игровых объектов ---
        function clearGameObjects() {
            // Удаляем меши змейки
            snakeMeshes.forEach(mesh => scene.remove(mesh));
            snakeMeshes = [];
            
            // Удаляем яблоко
            if (appleMesh) {
                scene.remove(appleMesh);
                appleMesh = null;
            }
            
            // Удаляем стены
            wallMeshes.forEach(mesh => scene.remove(mesh));
            wallMeshes = [];
            
            // Удаляем землю
            if (scene.getObjectByName('ground')) {
                scene.remove(scene.getObjectByName('ground'));
            }
        }

        // --- Генерация карты ---
        function generateMap(mapType) {
            clearGameObjects();
            
            // Определяем размер и стены в зависимости от карты
            if (mapType === 'empty') {
                gridSize = 15;
                halfSize = Math.floor(gridSize / 2);
                walls = [];
            } else if (mapType === 'maze1') {
                gridSize = 15;
                halfSize = Math.floor(gridSize / 2);
                // Простой лабиринт
                walls = [
                    // Внешние стены
                    ...createBorderWalls(gridSize),
                    // Внутренние стены
                    {x: -3, z: -3}, {x: -2, z: -3}, {x: -1, z: -3},
                    {x: 1, z: -1}, {x: 2, z: -1}, {x: 3, z: -1},
                    {x: -4, z: 1}, {x: -3, z: 1}, {x: -2, z: 1},
                    {x: 1, z: 3}, {x: 2, z: 3}, {x: 3, z: 3},
                    {x: -1, z: 4}, {x: 0, z: 4}, {x: 1, z: 4},
                    {x: 3, z: -4}, {x: 4, z: -4}, {x: 5, z: -4},
                    {x: -4, z: -1}, {x: -4, z: 0}, {x: -4, z: 1},
                ];
            } else if (mapType === 'maze2') {
                gridSize = 15;
                halfSize = Math.floor(gridSize / 2);
                // Другой лабиринт
                walls = [
                    ...createBorderWalls(gridSize),
                    {x: -2, z: -4}, {x: -2, z: -3}, {x: -2, z: -2},
                    {x: 0, z: -4}, {x: 1, z: -4}, {x: 2, z: -4},
                    {x: -4, z: -1}, {x: -4, z: 0}, {x: -4, z: 1},
                    {x: 4, z: -1}, {x: 4, z: 0}, {x: 4, z: 1},
                    {x: -3, z: 3}, {x: -2, z: 3}, {x: -1, z: 3},
                    {x: 1, z: 3}, {x: 2, z: 3}, {x: 3, z: 3},
                    {x: 0, z: 1}, {x: 0, z: 2}, {x: 0, z: 3},
                    {x: 3, z: -3}, {x: 3, z: -2}, {x: 3, z: -1},
                ];
            }
            
            // Создаём землю
            createGround();
            
            // Создаём стены
            createWalls();
        }
        
        function createBorderWalls(size) {
            const walls = [];
            const half = Math.floor(size / 2);
            for (let i = -half; i <= half; i++) {
                // Верхняя и нижняя границы
                walls.push({x: i, z: -half});
                walls.push({x: i, z: half});
                // Левая и правая границы (без углов, чтобы не дублировать)
                if (i > -half && i < half) {
                    walls.push({x: -half, z: i});
                    walls.push({x: half, z: i});
                }
            }
            return walls;
        }

        // --- Создание земли ---
        function createGround() {
            const groundGeo = new THREE.BoxGeometry(gridSize + 1, 0.2, gridSize + 1);
            const groundMat = new THREE.MeshStandardMaterial({ 
                color: CONFIG.colors.ground,
                emissive: 0x111111,
                roughness: 0.7,
                metalness: 0.2
            });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.position.y = -0.1;
            ground.receiveShadow = true;
            ground.name = 'ground';
            scene.add(ground);
            
            // Сетка на земле для красоты
            const gridHelper = new THREE.GridHelper(gridSize, gridSize, 0x00ff00, 0x336633);
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);
        }

        // --- Создание стен ---
        function createWalls() {
            wallMeshes.forEach(mesh => scene.remove(mesh));
            wallMeshes = [];
            
            const wallGeo = new THREE.BoxGeometry(0.9, 1, 0.9);
            const wallMat = new THREE.MeshStandardMaterial({ 
                color: CONFIG.colors.wall,
                emissive: 0x331100,
                roughness: 0.6,
                metalness: 0.3
            });
            
            walls.forEach(pos => {
                const wall = new THREE.Mesh(wallGeo, wallMat);
                wall.position.set(pos.x, 0.5, pos.z);
                wall.castShadow = true;
                wall.receiveShadow = true;
                scene.add(wall);
                wallMeshes.push(wall);
            });
        }

        // --- Инициализация змейки ---
        function initSnake() {
            // Удаляем старые меши
            snakeMeshes.forEach(mesh => scene.remove(mesh));
            snakeMeshes = [];
            
            // Начальная позиция змейки (центр, но не на стене)
            let startX = 0, startZ = 0;
            // Если на пустой карте - центр, иначе ищем свободное место
            if (currentMap !== 'empty') {
                // Простой поиск свободной клетки рядом с центром
                for (let r = 0; r < 5; r++) {
                    let found = false;
                    for (let dx = -r; dx <= r; dx++) {
                        for (let dz = -r; dz <= r; dz++) {
                            const x = dx, z = dz;
                            if (!walls.some(w => w.x === x && w.z === z)) {
                                startX = x;
                                startZ = z;
                                found = true;
                                break;
                            }
                        }
                        if (found) break;
                    }
                    if (found) break;
                }
            }
            
            // Создаём сегменты змейки (начальная длина 3)
            snake = [
                new THREE.Vector3(startX, 0, startZ),
                new THREE.Vector3(startX - 1, 0, startZ),
                new THREE.Vector3(startX - 2, 0, startZ)
            ];
            
            // Направление по умолчанию - вправо
            direction.set(1, 0, 0);
            nextDirection.set(1, 0, 0);
            
            // Создаём меши
            updateSnakeMeshes();
        }

        // --- Обновление мешей змейки ---
        function updateSnakeMeshes() {
            // Удаляем все старые меши
            snakeMeshes.forEach(mesh => scene.remove(mesh));
            snakeMeshes = [];
            
            const headGeo = new THREE.SphereGeometry(0.4, 16, 16);
            const bodyGeo = new THREE.SphereGeometry(0.35, 16, 16);
            
            snake.forEach((segment, index) => {
                const isHead = index === 0;
                const geo = isHead ? headGeo : bodyGeo;
                const color = isHead ? CONFIG.colors.snakeHead : CONFIG.colors.snakeBody;
                
                const mat = new THREE.MeshStandardMaterial({ 
                    color: color,
                    emissive: isHead ? 0x00aa00 : 0x005500,
                    roughness: 0.4,
                    metalness: 0.3
                });
                
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.copy(segment);
                mesh.position.y = 0.4;
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                
                // Для головы добавляем глаза
                if (isHead) {
                    const eyeGeo = new THREE.SphereGeometry(0.1, 8, 8);
                    const eyeMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
                    
                    const eye1 = new THREE.Mesh(eyeGeo, eyeMat);
                    eye1.position.set(0.2, 0.15, 0.25);
                    mesh.add(eye1);
                    
                    const eye2 = new THREE.Mesh(eyeGeo, eyeMat);
                    eye2.position.set(-0.2, 0.15, 0.25);
                    mesh.add(eye2);
                    
                    // Зрачки
                    const pupilGeo = new THREE.SphereGeometry(0.05, 6, 6);
                    const pupilMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
                    
                    const pupil1 = new THREE.Mesh(pupilGeo, pupilMat);
                    pupil1.position.set(0.2, 0.15, 0.35);
                    mesh.add(pupil1);
                    
                    const pupil2 = new THREE.Mesh(pupilGeo, pupilMat);
                    pupil2.position.set(-0.2, 0.15, 0.35);
                    mesh.add(pupil2);
                }
                
                scene.add(mesh);
                snakeMeshes.push(mesh);
            });
        }

        // --- Создание яблока ---
        function spawnApple() {
            if (appleMesh) {
                scene.remove(appleMesh);
                appleMesh = null;
            }
            
            // Ищем свободную клетку
            const freeCells = [];
            for (let x = -halfSize; x <= halfSize; x++) {
                for (let z = -halfSize; z <= halfSize; z++) {
                    // Проверяем, не занята ли клетка стеной
                    const isWall = walls.some(w => w.x === x && w.z === z);
                    // Проверяем, не занята ли клетка змейкой
                    const isSnake = snake.some(s => s.x === x && s.z === z);
                    
                    if (!isWall && !isSnake) {
                        freeCells.push({x, z});
                    }
                }
            }
            
            if (freeCells.length === 0) {
                // Победа! Все клетки заняты
                gameOver(true);
                return;
            }
            
            const pos = freeCells[Math.floor(Math.random() * freeCells.length)];
            
            // Создаём яблоко (красное яблоко с листиком)
            const appleGroup = new THREE.Group();
            
            const appleGeo = new THREE.SphereGeometry(0.35, 16, 16);
            const appleMat = new THREE.MeshStandardMaterial({ 
                color: CONFIG.colors.apple,
                emissive: 0x550000,
                roughness: 0.3,
                metalness: 0.1
            });
            const appleBody = new THREE.Mesh(appleGeo, appleMat);
            appleBody.castShadow = true;
            appleBody.receiveShadow = true;
            appleGroup.add(appleBody);
            
            // Листик
            const leafGeo = new THREE.ConeGeometry(0.15, 0.2, 8);
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
            const leaf = new THREE.Mesh(leafGeo, leafMat);
            leaf.position.set(0.1, 0.4, 0);
            leaf.rotation.z = -0.3;
            leaf.rotation.x = 0.2;
            appleGroup.add(leaf);
            
            // Палочка
            const stemGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.2, 6);
            const stemMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            const stem = new THREE.Mesh(stemGeo, stemMat);
            stem.position.set(0, 0.4, 0);
            appleGroup.add(stem);
            
            appleGroup.position.set(pos.x, 0.35, pos.z);
            scene.add(appleGroup);
            appleMesh = appleGroup;
            
            apple = new THREE.Vector3(pos.x, 0, pos.z);
        }

        // --- Движение змейки ---
        function moveSnake() {
            if (!gameActive) return;
            
            // Применяем отложенное направление
            if (nextDirection.length() > 0) {
                direction.copy(nextDirection);
            }
            
            // Вычисляем новую позицию головы
            const head = snake[0].clone();
            const newHead = head.clone().add(direction);
            
            // Проверка выхода за границы
            if (newHead.x < -halfSize || newHead.x > halfSize || 
                newHead.z < -halfSize || newHead.z > halfSize) {
                gameOver(false);
                return;
            }
            
            // Проверка столкновения со стенами
            if (walls.some(w => w.x === newHead.x && w.z === newHead.z)) {
                gameOver(false);
                return;
            }
            
            // Проверка столкновения с собой (кроме хвоста, который сейчас исчезнет)
            // Но если съедаем яблоко, хвост не исчезает, поэтому проверяем всю змейку кроме последнего сегмента
            const willEat = apple && newHead.x === apple.x && newHead.z === apple.z;
            const bodyToCheck = willEat ? snake : snake.slice(0, -1);
            
            if (bodyToCheck.some(s => s.x === newHead.x && s.z === newHead.z)) {
                gameOver(false);
                return;
            }
            
            // Добавляем новую голову
            snake.unshift(newHead);
            
            // Если съели яблоко
            if (willEat) {
                score += 10;
                document.getElementById('score').textContent = score;
                spawnApple();
                // Хвост не удаляем - змейка растёт
            } else {
                // Удаляем хвост
                snake.pop();
            }
            
            // Обновляем меши
            updateSnakeMeshes();
        }

        // --- Завершение игры ---
        function gameOver(win = false) {
            gameActive = false;
            if (gameLoopInterval) {
                clearInterval(gameLoopInterval);
                gameLoopInterval = null;
            }
            
            document.getElementById('final-score').textContent = score;
            document.getElementById('game-over').style.display = 'block';
            
            if (win) {
                document.querySelector('#game-over h2').textContent = 'ПОБЕДА!';
                document.querySelector('#game-over h2').style.color = '#ffaa00';
            } else {
                document.querySelector('#game-over h2').textContent = 'ИГРА ОКОНЧЕНА';
                document.querySelector('#game-over h2').style.color = '#00ff00';
            }
        }

        // --- Запуск игры ---
        function startGame() {
            // Скрываем меню
            document.getElementById('menu').style.display = 'none';
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('controls-info').style.display = 'block';
            
            // Сброс счёта
            score = 0;
            document.getElementById('score').textContent = score;
            
            // Генерация карты
            generateMap(currentMap);
            
            // Инициализация змейки
            initSnake();
            
            // Спавн яблока
            spawnApple();
            
            // Запуск игрового цикла
            gameActive = true;
            if (gameLoopInterval) clearInterval(gameLoopInterval);
            gameLoopInterval = setInterval(moveSnake, CONFIG.snakeSpeed * 1000);
            
            // Настройка камеры
            camera.position.set(12, 18, 15);
            controls.target.set(0, 0, 0);
            controls.update();
        }

        // --- Обработка клавиш ---
        function handleKeyDown(event) {
            if (!gameActive) return;
            
            const key = event.key;
            let newDir = null;
            
            // Предотвращаем обратное направление
            const isOpposite = (dir) => {
                return dir.x === -direction.x && dir.z === -direction.z;
            };
            
            if (key === 'ArrowUp' || key === 'w' || key === 'W') {
                newDir = new THREE.Vector3(0, 0, -1);
            } else if (key === 'ArrowDown' || key === 's' || key === 'S') {
                newDir = new THREE.Vector3(0, 0, 1);
            } else if (key === 'ArrowLeft' || key === 'a' || key === 'A') {
                newDir = new THREE.Vector3(-1, 0, 0);
            } else if (key === 'ArrowRight' || key === 'd' || key === 'D') {
                newDir = new THREE.Vector3(1, 0, 0);
            }
            
            if (newDir && !isOpposite(newDir)) {
                nextDirection.copy(newDir);
            }
            
            // Предотвращаем прокрутку страницы
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(key)) {
                event.preventDefault();
            }
        }

        // --- Инициализация UI ---
        function initUI() {
            // Выбор карты
            document.querySelectorAll('.map-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.map-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    currentMap = btn.dataset.map;
                });
            });
            
            // Кнопка старта
            document.getElementById('start-btn').addEventListener('click', startGame);
            
            // Кнопка рестарта
            document.getElementById('restart-btn').addEventListener('click', () => {
                document.getElementById('game-over').style.display = 'none';
                startGame();
            });
            
            // Клавиатура
            window.addEventListener('keydown', handleKeyDown);
        }

        // --- Анимационный цикл ---
        function animate() {
            requestAnimationFrame(animate);
            
            // Вращение яблока для красоты
            if (appleMesh) {
                appleMesh.rotation.y += 0.02;
            }
            
            controls.update();
            renderer.render(scene, camera);
        }

        // --- Запуск приложения ---
        function init() {
            initScene();
            initUI();
            animate();
        }

        init();
    </script>
</body>
  </html>
